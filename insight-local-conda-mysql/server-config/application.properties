spring.config.import=optional:configtree:/run/secrets/, file:config/override.properties

server.port=${SERVER_PORT}
insight.server.system.url=${SERVER_PROTOCOL}://${SERVER_HOSTNAME}:${SERVER_PORT}
insight.server.system.allowed-hostnames=server
insight.server.execution.server-url=${SERVER_PROTOCOL}://server:${SERVER_PORT}
insight.server.execution.default-worker-urls=${SERVER_PROTOCOL}://worker:${SERVER_PORT}
insight.server.execution.override-worker-urls=${SERVER_PROTOCOL}://worker:${SERVER_PORT}
insight.server.system.log-appender=CONSOLE

insight.configuration.key=${INSIGHT_CONFIGURATION_KEY}

insight.server.license.system=LICENSE_SPRING

insight.server.persistence.store=mysql
insight.server.persistence.mysql.enforce-validation=false
insight.server.persistence.mysql.url=jdbc:mysql://db:3306/insight
insight.server.persistence.mysql.password=${db_password}

grpc.server.port=${SERVER_EXTERNAL_PYTHON_DEBUG_PORT}

# SSL Defaults uses self-signed auto-generated public-certificate
server.ssl.enabled=${ENABLE_SSL}
server.ssl.key-alias=insight-server-https
server.ssl.key-store=public-certificates/insight-keystore-server-ssl
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.ciphers=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

insight.server.security.saml2.idp-metadata-xml=/server/config/idp-metadata.xml
insight.server.security.saml2.encryption-key-store=/server/config/idp-keystore