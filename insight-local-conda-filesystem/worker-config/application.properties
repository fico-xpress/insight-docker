spring.config.import=file:config/override.properties

insight.worker.system.allowed-hostnames=worker
insight.worker.execution.authentication.certificate=/worker/public-certificates/insight-execution-jwt.cert

insight.worker.system.log-appender=CONSOLE

# Python properties
insight.worker.execution.environment.MOSEL_RESTR=0
insight.worker.execution.environment.PATH=${PATH}

#insight.worker.execution.environment.XPAUTH_PATH=/xpress-license/xpauth.xpr

# SSL Defaults:
server.port=${SERVER_PORT}
server.ssl.enabled=${ENABLE_SSL}
server.ssl.key-alias=insight-worker-https
server.ssl.key-store=public-certificates/insight-keystore-worker-ssl
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.ciphers=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256