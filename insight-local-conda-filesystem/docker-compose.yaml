services:
    server:
        build:
            dockerfile: ../server.Dockerfile
            no_cache: true
            args:
              IMAGE_SERVER: ${IMAGE_SERVER}${INSIGHT_VERSION:+:${INSIGHT_VERSION}}
        platform: linux/amd64
        ports:
            # SERVER_PORT is defined in the .env file (default 8080)
            - "${SERVER_PORT}:${SERVER_PORT}"
            # SERVER_EXTERNAL_PYTHON_DEBUG_PORT is defined in the .env file (default 8090)
            - "${SERVER_EXTERNAL_PYTHON_DEBUG_PORT}:${SERVER_EXTERNAL_PYTHON_DEBUG_PORT}"
        environment:
            - SERVER_HOSTNAME=${SERVER_HOSTNAME}
            - SERVER_PORT=${SERVER_PORT}
            - ENABLE_SSL=${ENABLE_SSL}
            - SERVER_PROTOCOL=${SERVER_PROTOCOL}
            - SERVER_EXTERNAL_PYTHON_DEBUG_PORT=${SERVER_EXTERNAL_PYTHON_DEBUG_PORT}
        volumes:
            # server-config mounted onto server/config in the container
            - ./server-config:/server/config
            # You can see the repo and silo are in the volume 'insight-local-conda-filesystem_data'
            - data:/data
            # When it starts, the server generates a public certificate visible to the worker
            - public-certificates:/server/public-certificates
            # Where to store the server logs.
            - ./logs:/server/logs
        healthcheck:
            test: curl --insecure -f ${SERVER_PROTOCOL:-http}://localhost:${SERVER_PORT}/insightservices/rest/ready || exit 1
            retries: 10
            interval: 15s
            timeout: 10s
        secrets:
            - ssl_keystore_password
    worker:
        depends_on:
            server:
                condition: service_healthy
        platform: linux/amd64
        build:
            dockerfile: ./worker-conda.Dockerfile
            no_cache: true
            args:
              IMAGE_WORKER: ${IMAGE_WORKER}${INSIGHT_VERSION:+:${INSIGHT_VERSION}}
        volumes:
            # worker-config mounted onto worker/config in the container
            - ./worker-config:/worker/config
            # Add the server's public certificate
            - public-certificates:/worker/public-certificates
            # Where to store the worker logs. Uncomment the line below if needing to save the logs to files
            - ./logs:/worker/logs
            - ./environments:/worker/environments
            # to override the license
            - ./xpress-license:/xpress-license
        environment:
            MINICONDA_ENV: ${MINICONDA_ENV}
            SERVER_PORT: ${SERVER_PORT}
            ENABLE_SSL: ${ENABLE_SSL}
            SERVER_PROTOCOL: ${SERVER_PROTOCOL}
        secrets:
            - ssl_keystore_password
        healthcheck:
            test: curl --insecure -f ${SERVER_PROTOCOL:-http}://localhost:${SERVER_PORT}/worker/rest/alive || exit 1
            retries: 10
            interval: 15s
            timeout: 10s
    workbench:
        build:
            dockerfile: ../workbench-conda.Dockerfile
            no_cache: true
            args:
              IMAGE_WORKBENCH:  ${IMAGE_WORKBENCH}${INSIGHT_VERSION:+:${INSIGHT_VERSION}}

        platform: linux/amd64
        ports:
                - "127.0.0.1:${WORKBENCH_EXTERNAL_PORT}:8080"
        volumes:
            # where to store the user data (default to the internal docker volume)
            - ${WORKBENCH_DATA_VOLUME:-workbench-data}:/workbench-data

            # configuration for Workbench
            - ./workbench-config:/workbench-config

            # where to store the insight servers credentials
            - workbench-server-credentials:/workbench-server-credentials

            # where to store the logs
            - workbench-logs:/workbench-logs

            # So Workbench can trust self-signed certificates for server
            - public-certificates:/public-certificates

            # to override the license
            - ./xpress-license:/xp-license

        environment:
            - SERVER_PORT=${SERVER_PORT}
            - ENABLE_SSL=${ENABLE_SSL}
            - WORKBENCH_LOGGING=${WORKBENCH_LOGGING:-}
            - MOSEL_RUNNER_LOGGING=${MOSEL_RUNNER_LOGGING:-}
            - GRPC_TRACE=${GRPC_TRACE:-}
            - GRPC_VERBOSITY=${GRPC_VERBOSITY:-}
            - WORKBENCH_EXTRA_CA_CERT_FILES=${WORKBENCH_EXTRA_CA_CERT_FILES:-}

secrets:
    ssl_keystore_password:
        file: ssl_keystore_password.txt
volumes:
    data:
    public-certificates:
    workbench-data:
    workbench-server-credentials:
    workbench-logs:
